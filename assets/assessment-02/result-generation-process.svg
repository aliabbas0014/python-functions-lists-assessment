<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-label="Student Result Card Generation Sequence Process Diagram">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#183f65"/>
      <stop offset="72%" stop-color="#245b8f"/>
      <stop offset="100%" stop-color="#397aa9"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#245b8f"/>
    </marker>
    <style>
      .t { font-family: Georgia, serif; font-size: 22px; font-weight: bold; fill: #ffffff; }
      .s { font-family: Inter, Arial, sans-serif; font-size: 13px; fill: #e3edf5; }
      .col { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .msg { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #293747; }
      .code { font-family: Consolas, monospace; font-size: 11.5px; fill: #183f65; }
    </style>
  </defs>

  <rect width="1120" height="560" rx="20" fill="#f3f0e8"/>
  <rect x="24" y="20" width="1072" height="72" rx="14" fill="url(#heroGrad)"/>
  <text x="44" y="51" class="t">Result Card Generation Process — result_card_generator.py</text>
  <text x="44" y="73" class="s">Step-by-step interaction between User, Main Script, Validation/Scoring Functions, and Output</text>

  <rect x="52" y="114" width="180" height="40" rx="8" fill="#183f65"/>
  <text x="142" y="139" text-anchor="middle" class="col">User (Console)</text>
  <line x1="142" y1="154" x2="142" y2="532" stroke="#9db5ca" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="330" y="114" width="210" height="40" rx="8" fill="#245b8f"/>
  <text x="435" y="139" text-anchor="middle" class="col">Main Script</text>
  <line x1="435" y1="154" x2="435" y2="532" stroke="#9db5ca" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="615" y="114" width="235" height="40" rx="8" fill="#245b8f"/>
  <text x="732" y="139" text-anchor="middle" class="col">Helper Functions</text>
  <line x1="732" y1="154" x2="732" y2="532" stroke="#9db5ca" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="910" y="114" width="160" height="40" rx="8" fill="#397aa9"/>
  <text x="990" y="139" text-anchor="middle" class="col">Result Card</text>
  <line x1="990" y1="154" x2="990" y2="532" stroke="#9db5ca" stroke-width="1.5" stroke-dasharray="6 4"/>

  <line x1="142" y1="185" x2="435" y2="185" stroke="#245b8f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="155" y="179" class="msg">1. Raw name &amp; roll input</text>

  <line x1="435" y1="220" x2="732" y2="220" stroke="#245b8f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="448" y="214" class="code">2. format_name(), get_valid_roll_number()</text>

  <line x1="142" y1="265" x2="435" y2="265" stroke="#245b8f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="155" y="259" class="msg">3. Marks for 5 subjects</text>

  <line x1="435" y1="300" x2="732" y2="300" stroke="#245b8f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="448" y="294" class="code">4. get_valid_marks(subject) × 5 (0..100)</text>

  <line x1="435" y1="348" x2="732" y2="348" stroke="#245b8f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="448" y="342" class="code">5. calculate_percentage(total, 500)</text>

  <line x1="435" y1="392" x2="732" y2="392" stroke="#245b8f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="448" y="386" class="code">6. get_grade(percentage)</text>

  <rect x="336" y="414" width="248" height="44" rx="8" fill="#fbf2e8" stroke="#d58b52" stroke-width="1.4"/>
  <text x="460" y="433" text-anchor="middle" class="msg" font-weight="700">7. Check marks &lt; 40 across values</text>
  <text x="460" y="450" text-anchor="middle" class="msg">Sets final_status = "Fail" or "Pass"</text>

  <line x1="435" y1="492" x2="990" y2="492" stroke="#245b8f" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="595" y="485" class="msg" font-weight="700">8. Print full f-string result card to stdout</text>
</svg>