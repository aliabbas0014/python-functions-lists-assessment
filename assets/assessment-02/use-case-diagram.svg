<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-label="Use Case Diagram for Both Python Programs">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#183f65"/>
      <stop offset="72%" stop-color="#245b8f"/>
      <stop offset="100%" stop-color="#397aa9"/>
    </linearGradient>
    <style>
      .t { font-family: Georgia, serif; font-size: 22px; font-weight: bold; fill: #ffffff; }
      .s { font-family: Inter, Arial, sans-serif; font-size: 13px; fill: #e3edf5; }
      .act { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #183f65; }
      .uc { font-family: Inter, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #293747; }
      .lbl { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 1.2px; fill: #245b8f; }
    </style>
  </defs>

  <rect width="1120" height="620" rx="20" fill="#f3f0e8"/>
  <rect x="24" y="20" width="1072" height="74" rx="14" fill="url(#heroGrad)"/>
  <text x="44" y="52" class="t">Use Case Overview — Assessment 02</text>
  <text x="44" y="75" class="s">User / Instructor interactions across result_card_generator.py and class_marks_analyzer.py</text>

  <circle cx="96" cy="295" r="24" fill="#fffefa" stroke="#183f65" stroke-width="2.5"/>
  <line x1="96" y1="319" x2="96" y2="380" stroke="#183f65" stroke-width="2.5"/>
  <line x1="62" y1="340" x2="130" y2="340" stroke="#183f65" stroke-width="2.5"/>
  <line x1="96" y1="380" x2="68" y2="425" stroke="#183f65" stroke-width="2.5"/>
  <line x1="96" y1="380" x2="124" y2="425" stroke="#183f65" stroke-width="2.5"/>
  <text x="96" y="452" text-anchor="middle" class="act">User / Evaluator</text>

  <rect x="190" y="114" width="425" height="480" rx="16" fill="#fffefa" stroke="#245b8f" stroke-width="1.8"/>
  <text x="210" y="140" class="lbl">PROGRAM 1: RESULT CARD GENERATOR</text>

  <ellipse cx="402" cy="184" rx="170" ry="26" fill="#f8f6f0" stroke="#245b8f" stroke-width="1.4"/>
  <text x="402" y="189" text-anchor="middle" class="uc">Enter &amp; Format Name (.strip().title())</text>

  <ellipse cx="402" cy="248" rx="170" ry="26" fill="#f8f6f0" stroke="#245b8f" stroke-width="1.4"/>
  <text x="402" y="253" text-anchor="middle" class="uc">Enter Roll Number (.isdigit() Check)</text>

  <ellipse cx="402" cy="312" rx="170" ry="26" fill="#f8f6f0" stroke="#245b8f" stroke-width="1.4"/>
  <text x="402" y="317" text-anchor="middle" class="uc">Enter 5 Subject Marks (Validated 0–100)</text>

  <ellipse cx="402" cy="376" rx="170" ry="26" fill="#f8f6f0" stroke="#245b8f" stroke-width="1.4"/>
  <text x="402" y="381" text-anchor="middle" class="uc">Calculate Total, Percentage &amp; Grade</text>

  <ellipse cx="402" cy="440" rx="170" ry="26" fill="#f8f6f0" stroke="#d58b52" stroke-width="1.6"/>
  <text x="402" y="445" text-anchor="middle" class="uc">Apply Pass/Fail Rule (Any Subject &lt; 40 = Fail)</text>

  <ellipse cx="402" cy="504" rx="170" ry="26" fill="#f8f6f0" stroke="#245b8f" stroke-width="1.4"/>
  <text x="402" y="509" text-anchor="middle" class="uc">View Formatted Result Card Output</text>

  <rect x="645" y="114" width="445" height="480" rx="16" fill="#fffefa" stroke="#245b8f" stroke-width="1.8"/>
  <text x="665" y="140" class="lbl">PROGRAM 2: CLASS MARKS ANALYZER</text>

  <ellipse cx="867" cy="184" rx="180" ry="26" fill="#f8f6f0" stroke="#245b8f" stroke-width="1.4"/>
  <text x="867" y="189" text-anchor="middle" class="uc">Specify Positive Student Count (&gt; 0)</text>

  <ellipse cx="867" cy="248" rx="180" ry="26" fill="#f8f6f0" stroke="#245b8f" stroke-width="1.4"/>
  <text x="867" y="253" text-anchor="middle" class="uc">Record Student Names &amp; Marks (0–100)</text>

  <ellipse cx="867" cy="312" rx="180" ry="26" fill="#f8f6f0" stroke="#245b8f" stroke-width="1.4"/>
  <text x="867" y="317" text-anchor="middle" class="uc">Compute Class Average &amp; Pass/Fail (&gt;= 50)</text>

  <ellipse cx="867" cy="376" rx="180" ry="26" fill="#f8f6f0" stroke="#245b8f" stroke-width="1.4"/>
  <text x="867" y="381" text-anchor="middle" class="uc">Identify Highest &amp; Lowest Scorers</text>

  <ellipse cx="867" cy="440" rx="180" ry="26" fill="#f8f6f0" stroke="#245b8f" stroke-width="1.4"/>
  <text x="867" y="445" text-anchor="middle" class="uc">View Above-Average Students</text>

  <ellipse cx="867" cy="504" rx="180" ry="26" fill="#f8f6f0" stroke="#245b8f" stroke-width="1.4"/>
  <text x="867" y="509" text-anchor="middle" class="uc">View Sorted Marks (Desc) &amp; All Records</text>

  <line x1="126" y1="320" x2="232" y2="184" stroke="#245b8f" stroke-width="1.4"/>
  <line x1="126" y1="330" x2="232" y2="248" stroke="#245b8f" stroke-width="1.4"/>
  <line x1="126" y1="340" x2="232" y2="312" stroke="#245b8f" stroke-width="1.4"/>
  <line x1="126" y1="350" x2="232" y2="504" stroke="#245b8f" stroke-width="1.4"/>

  <line x1="126" y1="325" x2="687" y2="184" stroke="#397aa9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="126" y1="335" x2="687" y2="248" stroke="#397aa9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="126" y1="355" x2="687" y2="504" stroke="#397aa9" stroke-width="1.4" stroke-dasharray="5 4"/>
</svg>