<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" role="img" aria-label="List Processing and Class Statistics Workflow">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#183f65"/>
      <stop offset="72%" stop-color="#245b8f"/>
      <stop offset="100%" stop-color="#397aa9"/>
    </linearGradient>
    <style>
      .t { font-family: Georgia, serif; font-size: 22px; font-weight: bold; fill: #ffffff; }
      .s { font-family: Inter, Arial, sans-serif; font-size: 13px; fill: #e3edf5; }
      .h { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #183f65; }
      .b { font-family: Inter, Arial, sans-serif; font-size: 12.5px; fill: #293747; }
      .c { font-family: Consolas, monospace; font-size: 12px; font-weight: bold; fill: #183f65; }
    </style>
  </defs>

  <rect width="1120" height="540" rx="20" fill="#f3f0e8"/>
  <rect x="24" y="20" width="1072" height="72" rx="14" fill="url(#heroGrad)"/>
  <text x="44" y="51" class="t">List Operations &amp; Class Statistics — class_marks_analyzer.py</text>
  <text x="44" y="73" class="s">How append(), len(), sum(), max(), min(), and sorted() process student_names and student_marks</text>

  <rect x="36" y="114" width="1048" height="84" rx="14" fill="#fffefa" stroke="#245b8f" stroke-width="1.5"/>
  <text x="56" y="142" class="h">Parallel Lists State</text>
  <text x="56" y="166" class="c">student_names = ["Ali", "Sara", ...]</text>
  <text x="420" y="166" class="c">student_marks = [85, 95, ...]</text>
  <text x="760" y="166" class="b">Built via <tspan class="c">.append()</tspan> in matching order</text>
  <text x="56" y="186" class="b">Both lists share identical length <tspan class="c">len(student_marks)</tspan>, enabling index-based lookup <tspan class="c">student_names[i]</tspan> alongside <tspan class="c">student_marks[i]</tspan>.</text>

  <rect x="36" y="218" width="332" height="136" rx="12" fill="#fffefa" stroke="#d9d2c5" stroke-width="1.5"/>
  <text x="54" y="244" class="c">.append() &amp; len()</text>
  <text x="54" y="268" class="b">• Appends each cleaned name and validated</text>
  <text x="66" y="286" class="b">mark inside the student collection loop</text>
  <text x="54" y="310" class="b">• <tspan class="c">len(student_marks)</tspan> divides total sum in</text>
  <text x="66" y="328" class="b"><tspan class="c">calculate_average()</tspan> and drives index loops</text>

  <rect x="394" y="218" width="332" height="136" rx="12" fill="#fffefa" stroke="#d9d2c5" stroke-width="1.5"/>
  <text x="412" y="244" class="c">sum() &amp; Pass/Fail Count</text>
  <text x="412" y="268" class="b">• <tspan class="c">sum(student_marks) / len(student_marks)</tspan></text>
  <text x="424" y="286" class="b">produces <tspan class="c">class_average</tspan></text>
  <text x="412" y="310" class="b">• <tspan class="c">count_pass_fail()</tspan> increments pass if</text>
  <text x="424" y="328" class="b"><tspan class="c">marks &gt;= 50</tspan>, else increments fail</text>

  <rect x="752" y="218" width="332" height="136" rx="12" fill="#fffefa" stroke="#d9d2c5" stroke-width="1.5"/>
  <text x="770" y="244" class="c">max() &amp; min() + Name Lookup</text>
  <text x="770" y="268" class="b">• <tspan class="c">highest_marks = max(student_marks)</tspan></text>
  <text x="770" y="288" class="b">• <tspan class="c">lowest_marks = min(student_marks)</tspan></text>
  <text x="770" y="310" class="b">• Scans <tspan class="c">range(len(student_marks))</tspan> to print</text>
  <text x="782" y="328" class="b">all students matching high or low</text>

  <rect x="36" y="374" width="516" height="136" rx="12" fill="#fffefa" stroke="#d9d2c5" stroke-width="1.5"/>
  <text x="54" y="400" class="h">Above Class Average Filtering</text>
  <text x="54" y="424" class="b">Iterates <tspan class="c">i</tspan> across <tspan class="c">range(len(student_marks))</tspan>:</text>
  <text x="54" y="446" class="b">If <tspan class="c">student_marks[i] &gt; class_average</tspan>, prints <tspan class="c">student_names[i]</tspan> and marks,</text>
  <text x="54" y="466" class="b">and sets <tspan class="c">found_student = True</tspan>. If false after loop, prints fallback message.</text>

  <rect x="568" y="374" width="516" height="136" rx="12" fill="#fffefa" stroke="#d9d2c5" stroke-width="1.5"/>
  <text x="586" y="400" class="h">Descending Sort &amp; Full Roster</text>
  <text x="586" y="424" class="c">sorted_marks = sorted(student_marks, reverse=True)</text>
  <text x="586" y="446" class="b">• Returns a new list ordered highest to lowest without mutating <tspan class="c">student_marks</tspan></text>
  <text x="586" y="468" class="b">• Final section prints every student's name and marks from the parallel lists</text>
</svg>