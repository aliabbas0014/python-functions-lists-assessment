<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" role="img" aria-label="Class Marks Analyzer Flowchart">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#183f65"/>
      <stop offset="72%" stop-color="#245b8f"/>
      <stop offset="100%" stop-color="#397aa9"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#245b8f"/>
    </marker>
    <style>
      .t { font-family: Georgia, serif; font-size: 22px; font-weight: bold; fill: #ffffff; }
      .s { font-family: Inter, Arial, sans-serif; font-size: 13px; fill: #e3edf5; }
      .b { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #183f65; }
      .sm { font-family: Inter, Arial, sans-serif; font-size: 11.5px; fill: #293747; }
    </style>
  </defs>

  <rect width="1100" height="680" rx="20" fill="#f3f0e8"/>
  <rect x="24" y="20" width="1052" height="72" rx="14" fill="url(#heroGrad)"/>
  <text x="44" y="51" class="t">Flowchart — class_marks_analyzer.py</text>
  <text x="44" y="73" class="s">Batch collection into parallel lists followed by statistical &amp; ranking summary</text>

  <rect x="56" y="120" width="400" height="44" rx="22" fill="#183f65"/>
  <text x="256" y="147" text-anchor="middle" fill="#ffffff" class="b">Start &amp; Init: student_names = [], student_marks = []</text>

  <rect x="56" y="188" width="400" height="48" rx="10" fill="#fffefa" stroke="#245b8f" stroke-width="1.5"/>
  <text x="256" y="217" text-anchor="middle" class="b">total_students = get_student_count() (int &gt; 0)</text>

  <rect x="56" y="260" width="400" height="74" rx="10" fill="#fffefa" stroke="#245b8f" stroke-width="1.5"/>
  <text x="256" y="285" text-anchor="middle" class="b">Loop total_students times:</text>
  <text x="256" y="305" text-anchor="middle" class="sm">name = input().strip().title() → student_names.append(name)</text>
  <text x="256" y="323" text-anchor="middle" class="sm">marks = get_valid_marks(name) → student_marks.append(marks)</text>

  <rect x="56" y="358" width="400" height="52" rx="10" fill="#fffefa" stroke="#245b8f" stroke-width="1.5"/>
  <text x="256" y="389" text-anchor="middle" class="b">class_average = calculate_average(student_marks)</text>

  <rect x="56" y="434" width="400" height="64" rx="10" fill="#fffefa" stroke="#245b8f" stroke-width="1.5"/>
  <text x="256" y="460" text-anchor="middle" class="b">display_highest_lowest(student_names, student_marks)</text>
  <text x="256" y="480" text-anchor="middle" class="sm">passing, failing = count_pass_fail(student_marks)</text>

  <rect x="580" y="120" width="456" height="62" rx="10" fill="#fffefa" stroke="#245b8f" stroke-width="1.5"/>
  <text x="808" y="146" text-anchor="middle" class="b">Print Class Performance Summary</text>
  <text x="808" y="166" text-anchor="middle" class="sm">Class Average (.2f), Passing Students (&gt;= 50), Failing Students</text>

  <rect x="580" y="206" width="456" height="76" rx="10" fill="#fffefa" stroke="#245b8f" stroke-width="1.5"/>
  <text x="808" y="232" text-anchor="middle" class="b">Students Above Class Average</text>
  <text x="808" y="252" text-anchor="middle" class="sm">Iterate indices: if student_marks[i] &gt; class_average, print</text>
  <text x="808" y="270" text-anchor="middle" class="sm">If none found, print "No students scored above the class average."</text>

  <rect x="580" y="306" width="456" height="62" rx="10" fill="#fffefa" stroke="#245b8f" stroke-width="1.5"/>
  <text x="808" y="332" text-anchor="middle" class="b">Sort Marks Descending</text>
  <text x="808" y="352" text-anchor="middle" class="sm">sorted_marks = sorted(student_marks, reverse=True)</text>

  <rect x="580" y="392" width="456" height="62" rx="10" fill="#fffefa" stroke="#245b8f" stroke-width="1.5"/>
  <text x="808" y="418" text-anchor="middle" class="b">Print All Student Records</text>
  <text x="808" y="438" text-anchor="middle" class="sm">Loop i in range(len(student_names)): print name &amp; marks</text>

  <rect x="688" y="484" width="240" height="44" rx="22" fill="#183f65"/>
  <text x="808" y="511" text-anchor="middle" fill="#ffffff" class="b">End Analysis</text>

  <line x1="256" y1="164" x2="256" y2="188" stroke="#245b8f" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="256" y1="236" x2="256" y2="260" stroke="#245b8f" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="256" y1="334" x2="256" y2="358" stroke="#245b8f" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="256" y1="410" x2="256" y2="434" stroke="#245b8f" stroke-width="1.8" marker-end="url(#arr)"/>

  <path d="M 456 466 L 518 466 L 518 151 L 580 151" fill="none" stroke="#245b8f" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="808" y1="182" x2="808" y2="206" stroke="#245b8f" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="808" y1="282" x2="808" y2="306" stroke="#245b8f" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="808" y1="368" x2="808" y2="392" stroke="#245b8f" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="808" y1="454" x2="808" y2="484" stroke="#245b8f" stroke-width="1.8" marker-end="url(#arr)"/>
</svg>